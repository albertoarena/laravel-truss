version: 2
updates:
  # Keep the SHA-pinned workflow actions current. Dependabot rewrites both the
  # SHA and the trailing version comment when a new release lands.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  # Composer dependencies (runtime and dev). Minor and patch bumps are grouped
  # into a single PR to keep the noise down; majors open on their own.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Pest spans majors (^3.5 || ^4.0 || ^5.3) because each one needs a newer
    # PHP: 3 keeps the PHP 8.2 lane, 5 needs 8.4. A major bump would replace the
    # whole range and break the older lanes, so a new major is added by hand.
    ignore:
      - dependency-name: pestphp/pest
        update-types:
          - version-update:semver-major
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch

  # Client-side diagram tooling (Vitest, Playwright, the Mermaid generator).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
