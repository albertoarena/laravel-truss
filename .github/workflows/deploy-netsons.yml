name: Deploy Documentation

# Builds the Astro docs site for the root domain and deploys it to Netsons over
# SSH. Netsons has no rsync, so the runner ships dist/ as a single tarball via
# SCP, then runs one server-side script (base64-encoded to avoid quoting) that
# unpacks it into a timestamped release directory and flips a `current` symlink
# atomically. The whole deploy is two SSH connections (one scp, one ssh) to
# minimise Netsons' flaky-from-CI SSH; both are retried on connection errors and
# a stubborn timeout just needs a re-run. Manual-only (workflow_dispatch).
#
# Docroot wiring: Phase 1. The addon-domain docroot stays ~/${DEPLOY_PATH}; an
# .htaccess there (written idempotently by the server-side script) rewrites all
# traffic to current/ and blocks /releases/.
#
# Required repo Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS,
# SSH_KEY_PASSPHRASE (the deploy key is passphrase-protected), and optional
# SSH_PORT (defaults to 65100). Required repo Variable: DEPLOY_PATH (docroot
# relative to the SSH home, e.g. "trussphp.com"), kept as a variable so the
# server path is not committed.

on:
  workflow_dispatch:

concurrency:
  group: netsons-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'website/.nvmrc'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website for the root domain
        working-directory: website
        env:
          SITE_URL: 'https://trussphp.com'
          SITE_BASE: ''
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: website/dist
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65100' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host netsons
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config
          # The deploy key is passphrase-protected, so load it into an ssh-agent
          # via an askpass helper. Subsequent steps inherit the agent through
          # GITHUB_ENV and authenticate without any interactive prompt.
          if [ -z "${SSH_KEY_PASSPHRASE}" ]; then
            echo "::error::SSH_KEY_PASSPHRASE secret is not set, but the deploy key is passphrase-protected"
            exit 1
          fi
          eval "$(ssh-agent -s)"
          cat > /tmp/askpass.sh <<'SCRIPT'
          #!/usr/bin/env bash
          echo "${SSH_KEY_PASSPHRASE}"
          SCRIPT
          chmod +x /tmp/askpass.sh
          SSH_ASKPASS=/tmp/askpass.sh SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key
          rm -f /tmp/askpass.sh
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"

      - name: Diagnose SSH connectivity
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65100' }}
        run: |
          echo "== TCP probe ${SSH_PORT} =="
          if timeout 30 bash -c "exec 3<>/dev/tcp/${SSH_HOST}/${SSH_PORT}" 2>/dev/null; then
            echo "TCP connect OK"
          else
            echo "TCP connect FAILED (flaky from CI, the deploy retries; re-run if it fails)"
          fi

      - name: Deploy release
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          # Retry SSH/SCP on connection errors only (exit 255). Netsons SSH is
          # flaky from CI, so allow several attempts. Messages go to stderr so
          # they never pollute captured command output.
          ssh_retry() {
            local max=5 delay=15 attempt=0 code
            until ssh "$@"; do
              code=$?
              attempt=$((attempt + 1))
              [ $attempt -ge $max ] && return $code
              [ $code -eq 255 ] || return $code
              echo "SSH attempt ${attempt} failed (code ${code}), retrying in ${delay}s..." >&2
              sleep $delay
            done
          }
          scp_retry() {
            local max=5 delay=15 attempt=0 code
            until scp "$@"; do
              code=$?
              attempt=$((attempt + 1))
              [ $attempt -ge $max ] && return $code
              [ $code -eq 255 ] || return $code
              echo "SCP attempt ${attempt} failed (code ${code}), retrying in ${delay}s..." >&2
              sleep $delay
            done
          }

          set -euo pipefail

          if [ -z "${DEPLOY_PATH}" ]; then
            echo "::error::DEPLOY_PATH repo variable is not set"
            exit 1
          fi
          DP="${DEPLOY_PATH}"
          TS="$(date -u +%Y%m%d%H%M%S)"
          echo "Release timestamp: ${TS}"

          # Build one server-side script (base64-encoded to avoid quoting). It
          # ensures the .htaccess, unpacks the uploaded tarball into a new
          # release, flips the current symlink, and prunes old releases. Running
          # it in a single SSH session keeps the deploy to two connections.
          {
            printf 'set -e\n'
            printf 'DP=%q\n' "${DP}"
            printf 'TS=%q\n' "${TS}"
            cat <<'REMOTE'
          cd "$HOME/$DP"
          if [ ! -f .htaccess ]; then
          cat > .htaccess <<'HTA'
          Options +FollowSymLinks -Indexes
          RewriteEngine On
          RewriteRule ^releases(/.*)?$ - [F,L]
          RewriteCond %{REQUEST_URI} !^/current/
          RewriteRule ^(.*)$ current/$1 [L]
          HTA
          fi
          mkdir -p "releases/$TS"
          tar -xzf incoming.tar.gz -C "releases/$TS"
          rm -f incoming.tar.gz
          PREVIOUS="$(readlink current 2>/dev/null || true)"
          ln -sfn "releases/$TS" current
          ( cd releases && ls -1t | tail -n +4 | xargs -r rm -rf ) || true
          printf 'PREVIOUS=%s\n' "$PREVIOUS"
          REMOTE
          } > /tmp/remote_deploy.sh

          # Connection 1: upload the built site as one tarball.
          tar -czf /tmp/dist.tar.gz -C dist .
          scp_retry /tmp/dist.tar.gz "netsons:${DP}/incoming.tar.gz"

          # Connection 2: run the server-side script in one SSH session.
          B64="$(base64 -w0 < /tmp/remote_deploy.sh)"
          OUT="$(ssh_retry netsons "echo ${B64} | base64 -d | bash")"
          printf '%s\n' "${OUT}"
          PREVIOUS="$(printf '%s\n' "${OUT}" | sed -n 's/^PREVIOUS=//p')"
          echo "Previous release: ${PREVIOUS:-<none>}"

          # Verify the live site; roll back on failure.
          echo "Verifying https://trussphp.com/ ..."
          CODE="$(curl -s -o /dev/null -m 25 -A 'truss-deploy-check' -w '%{http_code}' https://trussphp.com/ || echo 000)"
          echo "HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "::error::Verification failed (HTTP ${CODE})."
            if [ -n "${PREVIOUS}" ]; then
              ssh_retry netsons "ln -sfn ${PREVIOUS} ~/${DP}/current"
              echo "Rolled back to ${PREVIOUS}"
            else
              echo "No previous release to roll back to (first deploy). Check the .htaccess and DNS."
            fi
            exit 1
          fi
          echo "Deploy complete: release ${TS} is live."

      - name: Remove SSH key
        if: always()
        run: |
          ssh-add -D 2>/dev/null || true
          ssh-agent -k 2>/dev/null || true
          rm -f ~/.ssh/deploy_key ~/.ssh/config
