name: frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    # A normal run takes about two minutes. Without a limit, a stalled step
    # waits for the six-hour job limit of GitHub Actions.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # Exactly the committed lockfile, so a run cannot pick up a newer
      # Playwright or Mermaid than the one the tests were written against.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests (Vitest)
        run: npm test

      # PHP and the package's own dependencies, for one spec: exported-file
      # builds its fixture by running truss:export for real, through
      # vendor/bin/testbench, and then opens the result over file://. It is also
      # the only spec that drives the shipped Blade markup rather than
      # tests/e2e/harness.html, so leaving it unable to run here would quietly
      # remove the one check that sees what users actually load.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Firefox is scoped by testMatch to the label-geometry spec alone. Issue
      # #59 was a Firefox-only clipping bug that Chromium could not reproduce,
      # so that one spec earns a second engine without doubling the run.
      # The browser cache is keyed on the Playwright version the lockfile
      # installed, so it changes only when the lockfile does.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The install downloads browsers and system packages. A slow mirror held
      # it for 14 minutes once, so it fails after 10 and the run can be retried.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium firefox

      # The cache holds the browsers but not the system packages they need.
      - name: Install Playwright system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium firefox

      - name: Browser tests (Playwright)
        run: npm run test:e2e

      # Reported as its own check so an accessibility regression is legible in the
      # PR without reading the full browser-test log. Covers the axe-core scan of
      # the dashboard and its overlays plus the keyboard-operation specs. The same
      # specs run in the step above; this is about visibility, not extra coverage.
      - name: Accessibility (axe-core + keyboard)
        run: npm run test:a11y
